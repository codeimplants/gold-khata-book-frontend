pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") 
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}
plugins { id("com.facebook.react.settings") 
id("expo-autolinking-settings")
}
def projectRoot = new File(settingsDir, "..").getCanonicalFile()
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  def command = new ArrayList<String>()
  if (System.getProperty("os.name").toLowerCase().contains("windows")) {
    command.addAll(["cmd", "/c"])
  }
  command.addAll(["npx", "@react-native-community/cli", "config"])
  def lockFiles = files(
    new File(projectRoot, "yarn.lock"),
    new File(projectRoot, "package-lock.json"),
    new File(projectRoot, "package.json"),
    new File(projectRoot, "react-native.config.js"),
  )
  ex.autolinkLibrariesFromCommand(command, projectRoot, lockFiles)
}
rootProject.name = 'gold-khata-book'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
expoAutolinking.useExpoModules()
expoAutolinking.useExpoVersionCatalog()
includeBuild(expoAutolinking.reactNativeGradlePlugin)
